name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Ruff
        run: pipx run ruff check src tests examples

  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Instalar GStreamer y PyGObject del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-gi gir1.2-gstreamer-1.0 gir1.2-gst-plugins-base-1.0 \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good
      - name: Pruebas unitarias
        # Python del sistema para usar los bindings de python3-gi instalados con apt.
        run: PYTHONPATH=src /usr/bin/python3 -m unittest discover -s tests -v
